[package]
name = "gsfw-core"
version = "0.1.0"
description = "GameSir firmware formats, JieLi GIP upgrade protocol and flash use cases"
authors = ["gamesir-fw contributors"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = "1.1.10"
nusb = "0.2.7"
serde_json = { version = "1.0.151", default-features = false, features = [
    "std",
] }
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8.4"
