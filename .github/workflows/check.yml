name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      # Q4: no firmware image and no file over 1 MB in the repository.
      - run: python tools/check_no_firmware.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --no-default-features
      # The tests use the clippy.toml in .clippy-test.
      - run: cargo clippy --all-targets --locked --workspace --no-default-features
        env:
          CLIPPY_CONF_DIR: .clippy-test
      - run: cargo test --locked --workspace --no-default-features
      - run: cargo doc --no-deps --locked --workspace --no-default-features
      - run: cargo build --release --locked --workspace --no-default-features
      # The dependency checks do not depend on the OS, so only Linux runs cargo-deny.
      - if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked --version 0.20.2
      - if: runner.os == 'Linux'
        run: cargo deny --locked --workspace --no-default-features check --deny warnings
